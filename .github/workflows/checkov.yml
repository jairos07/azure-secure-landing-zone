# Pipeline que escanea el Terraform con Checkov en cada cambio.
# Si Checkov encuentra un fallo de seguridad, el pipeline falla (rojo).
name: Checkov - escaneo de seguridad IaC

# Cuándo se ejecuta: al subir cambios a main o al abrir un pull request
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Mínimo privilegio: este pipeline solo puede LEER el repositorio
permissions:
  contents: read

jobs:
  checkov:
    name: Escanear terraform/secure
    runs-on: ubuntu-latest
    steps:
      # 1. Descarga el código del repo en la máquina del pipeline
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      # 2. Prepara Python, que es lo que necesita Checkov
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3. Instala Checkov (misma versión que en local, para resultados iguales)
      - name: Instalar Checkov
        run: pip install checkov==3.3.30

      # 4. Escanea la carpeta de Terraform seguro
      - name: Ejecutar Checkov
        run: checkov -d terraform/secure --compact
